<title>Редактор брифа SIX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Макет: слева структура брифа, по центру форма вопроса, справа предпросмотр как у клиента. Цвета те же, что на сайте брифа. */
:root{
  --bg:#F4F3F0; --card:#FFFFFF; --ink:#1D1C1A; --mut:#78746A; --line:#E1DED6; --acc:#85775A; --accD:#6B5F46; --soft:#EEEADF;
  --err:#B4513E; --ok:#5E7A5B; --pv:#ECE9E2;
  --disp:'Jost','Manrope',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1A18; --card:#252321; --ink:#EFEDE8; --mut:#A29D90; --line:#3A3733; --acc:#B6A57F; --accD:#C9B98F; --soft:#34302A;
  --err:#E0806C; --ok:#8FB08B; --pv:#201F1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A18; --card:#252321; --ink:#EFEDE8; --mut:#A29D90; --line:#3A3733; --acc:#B6A57F; --accD:#C9B98F; --soft:#34302A;
  --err:#E0806C; --ok:#8FB08B; --pv:#201F1D; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100svh;max-width:2100px;margin:0 auto}

/* шапка */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font:500 14px var(--disp);letter-spacing:.34em}
.logo b{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:8px;letter-spacing:.14em;padding-left:2px}
header h1{margin:0 6px 0 4px;font:300 22px var(--disp)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;border-radius:999px;padding:7px 16px;color:var(--mut);font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
.sp{flex:1}
.stat{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px}
.stat:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.stat.busy:before{background:var(--acc);animation:p 1s infinite}.stat.err:before{background:var(--err)}
@keyframes p{50%{opacity:.3}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.danger{color:var(--err)}
.btn.danger.arm{background:var(--err);color:#fff;border-color:var(--err)}

/* три колонки */
.cols{display:grid;grid-template-columns:310px minmax(360px,1fr) clamp(460px,40vw,760px);gap:16px;align-items:start;padding-bottom:90px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;min-width:0}
#tree{position:sticky;top:10px;max-height:calc(100svh - 80px);overflow:auto;padding:12px}
#pv{position:sticky;top:10px;max-height:calc(100svh - 80px);overflow:auto;background:var(--pv)}
#editor{padding:20px 22px 26px}
.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.gen{width:100%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:9px 12px;margin-bottom:10px;font-weight:500}
.sec{margin-bottom:6px}
.sech{display:flex;align-items:center;gap:6px;padding:7px 4px;border-radius:8px}
.sech.sel{background:var(--soft)}
.sech .tg{border:0;background:none;width:22px;color:var(--mut);transition:transform .15s}
.sech.open .tg{transform:rotate(90deg)}
.sech .nm{flex:1;min-width:0;text-align:left;border:0;background:none;font:500 14px var(--disp);letter-spacing:.04em;text-transform:uppercase;color:var(--accD)}
.sech .ct{font-size:12px;color:var(--mut)}
.sech .ad{border:1px solid var(--line);background:none;border-radius:50%;width:24px;height:24px;line-height:1;color:var(--mut)}
.sech .ad:hover{border-color:var(--acc);color:var(--acc)}
.sech.dropT{outline:2px dashed var(--acc)}
.q{display:flex;align-items:center;gap:8px;padding:7px 8px;margin:1px 0;border-radius:9px;cursor:pointer;border:1px solid transparent}
.q:hover{background:var(--bg)}
.q.sel{background:var(--soft);border-color:var(--acc)}
.q.drop{border-top:2px solid var(--acc)}
.q .h{color:var(--line);cursor:grab;user-select:none}
.q .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .b{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.q .b.c{color:var(--acc);border-color:var(--acc)}
.add{width:100%;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:8px;color:var(--mut);margin-top:6px}
.add:hover{border-color:var(--acc);color:var(--accD)}

/* форма */
.eb{font:500 11.5px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--accD);margin:0 0 6px}
#editor h2{margin:0 0 18px;font:300 26px/1.2 var(--disp)}
.f{display:block;margin:0 0 16px}
.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.f input[type=text],.f input[type=number],.f select,.f textarea,.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{outline:0;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;align-items:flex-start;gap:10px;margin:0 0 10px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--acc);width:17px;height:17px}
.chk small{display:block;color:var(--mut)}
.blk{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 18px}
.blk>h3{margin:0 0 10px;font:500 12px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--accD)}
.opr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:center}
.opr.plain{grid-template-columns:minmax(0,1fr) auto}
.opr .ac{display:flex;gap:4px}
.ic{border:1px solid var(--line);background:none;border-radius:8px;width:30px;height:30px;color:var(--mut);display:grid;place-items:center;font-size:13px}
.ic:hover{border-color:var(--acc);color:var(--accD)}
.thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.rule{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.1fr) auto;gap:8px;margin-bottom:8px}
.rule select,.rule input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.note{color:var(--mut);font-size:13px;margin:6px 0 0}
.warn{color:var(--err);font-size:13px;margin:6px 0 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
details.tech summary{cursor:pointer;color:var(--mut);font-size:13px}

/* предпросмотр */
.pvh{padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center}
.pvh b{font:500 11.5px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.phone{zoom:1.35;margin:12px 12px 12px;background:#F4F3F0;color:#1D1C1A;border-radius:18px;padding:20px 18px 18px;box-shadow:0 8px 30px -14px rgba(0,0,0,.35)}
.phone .eyebrow{font:500 10.5px var(--disp);letter-spacing:.2em;text-transform:uppercase;color:#6B5F46;margin:0 0 10px}
.phone h1{font:300 25px/1.15 var(--disp);margin:0 0 8px}
.phone h1 i{color:#85775A;font-style:normal}
.phone .hint{color:#78746A;font-size:13.5px;margin:0 0 14px}
.phone .inp{width:100%;border:0;border-bottom:1.5px solid #E1DED6;background:none;padding:8px 2px;font:300 18px var(--body);color:#B5B1A6}
.phone .ta{width:100%;border:1.5px solid #E1DED6;border-radius:12px;background:#fff;padding:12px;min-height:84px;color:#B5B1A6;font-size:14px}
.phone .opt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E1DED6;border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:14px}
.phone .opt i{flex:none;width:20px;height:20px;border:1.5px solid #E1DED6;display:grid;place-items:center;font:500 10px var(--disp);color:#78746A;font-style:normal}
.phone .opt.m i{border-radius:6px}.phone .opt.s i{border-radius:50%}
.phone .opt small{display:block;color:#78746A;font-size:12px}
.phone .cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone .cards.sw{grid-template-columns:repeat(3,1fr)}
.phone .card{background:#fff;border:1.5px solid #E1DED6;border-radius:12px;overflow:hidden}
.phone .card .ph{aspect-ratio:4/3;background:linear-gradient(135deg,#E9E5DA,#D9D3C3);display:grid;place-items:center;overflow:hidden}
.phone .cards.sw .ph{aspect-ratio:1}
.phone .card .ph img{width:100%;height:100%;object-fit:cover}
.phone .card .ph svg{width:24px;height:24px;stroke:#A99F86;fill:none;stroke-width:1.2}
.phone .card .tx{padding:8px 10px 10px;font-size:13px;font-weight:500;line-height:1.25}
.phone .card .tx small{display:block;color:#78746A;font-weight:400;font-size:11.5px;margin-top:2px}
.phone .row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1.5px solid #E1DED6;border-radius:12px;padding:8px 10px;margin-bottom:7px;font-size:13.5px}
.phone .pills{display:flex;gap:5px;flex-wrap:wrap}
.phone .pill{border:1.5px solid #E1DED6;border-radius:999px;padding:2px 9px;font-size:12px;color:#78746A}
.phone .rep{background:#fff;border:1.5px solid #E1DED6;border-radius:12px;padding:10px 12px;margin-bottom:7px;font-size:13px;color:#78746A}
.phone .rep b{display:block;font:500 10.5px var(--disp);letter-spacing:.18em;text-transform:uppercase;color:#6B5F46;margin-bottom:4px}
.phone .drop2{border:1.5px dashed #E1DED6;border-radius:12px;padding:20px;text-align:center;color:#78746A;font-size:13px;background:#fff}
.phone .mx{border:1.5px solid #E1DED6;border-radius:12px;background:#fff;overflow:auto}
.phone table{border-collapse:collapse;width:100%;font-size:12px}
.phone th{font:500 10px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:#6B5F46;padding:8px 4px}
.phone td{border-top:1px solid #E1DED6;padding:6px 6px;text-align:center}
.phone td:first-child{text-align:left}
.phone .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:13px}
.phone .nav span{color:#78746A}
.phone .nav b{background:#1D1C1A;color:#fff;border-radius:999px;padding:7px 18px;font-weight:500}
.cond{margin:0 16px 16px;font-size:14px;color:var(--mut)}
.cond b{color:var(--ink);font-weight:600}

.empty{padding:50px 20px;text-align:center;color:var(--mut)}
.savefab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:0 8px 30px -10px rgba(0,0,0,.3)}
.savefab .sfs{font-size:13px;color:var(--mut)}
.savefab .btn{padding:10px 24px}
body[data-dirty="1"] .savefab{border-color:var(--acc)}
body[data-dirty="1"] #bSave{background:var(--acc);border-color:var(--acc);color:#fff;animation:p 1.4s infinite}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 20px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.pop.on{display:flex}
.pop .bx{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:86svh;overflow:auto;padding:22px}
.pop h3{margin:0 0 12px;font:300 22px var(--disp)}
.pop textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,monospace}
.ver{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mtabs{display:none}

@media (max-width:1250px){.phone{zoom:1.1}.cols{grid-template-columns:280px minmax(320px,1fr) clamp(380px,36vw,520px)}}
@media (max-width:1000px){.cols{grid-template-columns:300px minmax(0,1fr)}#pv{display:none}.mtabs button[data-v=pv]{display:none}}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .mtabs{display:flex;gap:6px;margin-bottom:12px}
  .mtabs button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px}
  .mtabs button.on{background:var(--ink);color:var(--bg)}
  #tree,#pv,#editor{display:none;position:static;max-height:none}
  body[data-v=tree] #tree,body[data-v=ed] #editor,body[data-v=pv] #pv{display:block}
  .row2,.opr,.rule{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="logo"><b>SIX</b><span>STUDIO</span></div>
    <h1>Редактор брифа</h1>
    <div class="tabs" id="tabs"><button data-b="concept" class="on">Бриф 1 · концепция</button><button data-b="tech">Технический бриф</button></div>
    <div class="sp"></div>
    <span class="stat" id="stat">Загружаем…</span>
    <button class="btn sm" id="bVer">Версии</button>
    <button class="btn sm" id="bJson">Скопировать JSON</button>
  </header>
  <div>
    <div class="mtabs" id="mtabs"><button data-v="tree" class="on">Структура</button><button data-v="ed">Редактор</button><button data-v="pv">Как видит клиент</button></div>
    <div class="cols">
      <aside class="pane" id="tree"></aside>
      <section class="pane" id="editor"><div class="empty">Загружаем вопросы…</div></section>
      <aside class="pane" id="pv"></aside>
    </div>
  </div>
</div>
<div class="savefab"><span class="sfs" id="sfs"></span><button class="btn main" id="bSave">Сохранить</button></div>
<div class="toast" id="toast"></div>
<div class="pop" id="pop"><div class="bx" id="popBx"></div></div>

<script>
(function () {
  'use strict';
  var TYPES = { text: 'Короткий текст', long: 'Длинный текст', tel: 'Телефон', email: 'Email', number: 'Число', date: 'Дата', single: 'Список вариантов', cards: 'Карточки с картинками', rate: 'Оценка 1–5 по пунктам', grid: 'Таблица выбора', repeat: 'Повторяемая анкета (люди, дети)', files: 'Файлы', multitext: 'Несколько текстовых полей', matrix: 'Матрица с галочками' };
  var SHORT = { text: 'текст', long: 'абзац', tel: 'тел.', email: 'email', number: 'число', date: 'дата', single: 'выбор', cards: 'карточки', rate: 'оценка', grid: 'таблица', repeat: 'повтор', files: 'файлы', multitext: 'поля', matrix: 'матрица' };
  var OPS = { is: 'выбрано', isNot: 'не выбрано', filled: 'заполнено', empty: 'пусто' };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var uid = function () { return 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); };

  var db = null, assets = null;
  var S = { brief: 'concept', meta: {}, secs: {}, qs: {}, versions: [], sel: null, open: {}, filter: '', loaded: { meta: false, sections: false, questions: false }, view: 'tree' };
  var statEl = $('#stat');

  /* ---------- сохранение ---------- */
  var queue = {}, pendingCount = 0, errShown = false;
  function setStat(t, c) { var fs = document.getElementById('sfs'); if (fs) fs.textContent = (c === 'busy' ? 'Есть несохранённое' : (c === 'err' ? 'Ошибка' : 'Всё сохранено')); statEl.textContent = t; statEl.className = 'stat' + (c ? ' ' + c : ''); document.body.dataset.dirty = (c === 'busy') ? '1' : '0'; }
  function flushAll() {
    var paths = Object.keys(queue);
    if (!paths.length) { toast('Всё уже сохранено'); return; }
    setStat('Сохраняем…', 'busy');
    paths.forEach(function (p) { var e = queue[p]; if (e && e.timer) { clearTimeout(e.timer); e.timer = null; } run(p); });
    var t0 = Date.now();
    (function wait() {
      if (!Object.keys(queue).length) { if (!statEl.classList.contains('err')) toast('Сохранено'); }
      else if (Date.now() - t0 < 15000) setTimeout(wait, 200);
      else toast('Сохранение затянулось, проверьте связь');
    })();
  }
  function enqueue(path, obj) {               // obj === null -> удалить
    if (!db) return;
    var e = queue[path] || (queue[path] = { latest: obj, running: false });
    e.latest = obj;
    if (e.timer) clearTimeout(e.timer);
    e.timer = setTimeout(function () { run(path); }, 500);
    pendingCount++; setStat('Есть несохранённые изменения', 'busy');
  }
  function run(path) {
    var e = queue[path]; if (!e || e.running) return;
    e.running = true;
    var obj = e.latest, ref = db.doc(path);
    var p = obj === null ? ref.delete() : ref.set(JSON.parse(JSON.stringify(obj)));
    p.then(function () { return null; }, function (err) { setStat('Не сохранилось: ' + (err && err.code || 'ошибка'), 'err'); toast('Не удалось сохранить. Попробуйте ещё раз.'); })
      .then(function () {
        e.running = false;
        if (e.latest !== obj) return run(path);
        delete queue[path];
        if (!Object.keys(queue).length && !statEl.classList.contains('err')) setStat('Все изменения сохранены', '');
      });
  }
  var K = function (b, id) { return b + '__' + id; };
  function saveQ(q) { enqueue('questions/' + K(q.brief, q.id), q); }
  function saveSec(s) { enqueue('sections/' + K(s.brief, s.id), s); }
  function saveMeta() { enqueue('meta/' + S.brief, S.meta[S.brief]); }

  /* ---------- данные ---------- */
  function secList() { return Object.keys(S.secs).map(function (k) { return S.secs[k]; }).filter(function (s) { return s.brief === S.brief; }).sort(function (a, b) { return a.order - b.order; }); }
  function qList(secId) { return Object.keys(S.qs).map(function (k) { return S.qs[k]; }).filter(function (q) { return q.brief === S.brief && (!secId || q.sec === secId); }).sort(function (a, b) { return a.order - b.order; }); }
  function allQ() { var out = []; secList().forEach(function (s) { out = out.concat(qList(s.id)); }); return out; }
  function getQ(id) { return S.qs[K(S.brief, id)]; }
  function nextOrder(secId) { var l = qList(secId); if (l.length) return l[l.length - 1].order + 10; var all = qList(); return (all.length ? all[all.length - 1].order : 0) + 10; }
  function optsOf(q) { return (q && q.opts || []).map(function (o) { return o.l; }); }

  /* ---------- подписки ---------- */
  function subscribe() {
    function sub(name, store, keyFn, onFirst) {
      db.collection(name).onSnapshot(function (snap) {
        var fresh = {};
        snap.docs.forEach(function (d) { var v = d.data(); if (v) fresh[d.id] = JSON.parse(JSON.stringify(v)); });
        // не затираем документ, который прямо сейчас сохраняется
        Object.keys(fresh).forEach(function (id) { if (queue[name + '/' + id]) delete fresh[id]; });
        Object.keys(queue).forEach(function (p) { var parts = p.split('/'); if (parts[0] === name && S[store][parts[1]]) fresh[parts[1]] = S[store][parts[1]]; });
        S[store] = fresh; S.loaded[name] = true; onFirst();
      }, function () { setStat('Нет связи с базой', 'err'); });
    }
    sub('meta', 'meta', null, afterLoad);
    sub('sections', 'secs', null, afterLoad);
    sub('questions', 'qs', null, afterLoad);

  function renderPreview() {
    var el = $('#pv'), sel = S.sel;
    if (!sel || sel.kind !== 'q') { el.innerHTML = '<div class="pvh"><b>Как видит клиент</b></div><div class="empty">Выберите вопрос, чтобы увидеть его так, как увидит клиент.</div>'; return; }
    var q = getQ(sel.id); if (!q) { el.innerHTML = ''; return; }
    var s = S.secs[K(S.brief, q.sec)], list = qList(q.sec), n = list.findIndex(function (x) { return x.id === q.id; }) + 1;
    el.innerHTML = '<div class="pvh"><b>Как видит клиент</b></div><div class="phone"><p class="eyebrow">' + esc(s ? s.title : '') + ' · ' + n + '/' + list.length + '</p><h1>' + esc(q.title || '…') + (q.req ? ' <i>*</i>' : '') + '</h1>' +
      (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '') + '<div>' + pvControl(q) + '</div>' +
      '<div class="nav"><span>' + (q.req ? '' : (q.trust ? 'Не знаю, довіряю дизайнеру' : 'Пропустити')) + '</span><b>Далі</b></div></div><p class="cond">' + describeShow(q) + '</p>';
  }

  /* ---------- действия ---------- */
  var toastT = null;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 2600); }
  function touch(q) { saveQ(q); renderTree(); renderPreview(); }
  function select(sel) { S.sel = sel; renderTree(); renderEditor(); renderPreview(); if (matchMedia('(max-width:820px)').matches) setView('ed'); }
  function setView(v) { S.view = v; document.body.dataset.v = v; document.querySelectorAll('#mtabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === v); }); }
  function defaults(q) {                  // заготовки при смене типа
    var t = q.type;
    if ((t === 'single' || t === 'cards') && !q.opts && !q.optsFrom) q.opts = [{ l: 'Вариант 1' }, { l: 'Вариант 2' }];
    if ((t === 'rate' || t === 'multitext' || t === 'matrix') && !q.items && !q.itemsFrom) q.items = [{ id: 'i1', l: 'Пункт 1' }];
    if (t === 'matrix' && !q.cols && !q.colsFrom) q.cols = ['Колонка 1', 'Колонка 2'];
    if (t === 'grid' && !q.rows) q.rows = [{ id: 'r1', l: 'Строка 1', opts: ['Вариант 1', 'Вариант 2'] }];
    if (t === 'repeat' && !q.fields) q.fields = [{ id: 'f1', l: 'Имя' }];
  }
  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; }
  function reorderQ(q, dir) {
    var l = qList(q.sec), i = l.findIndex(function (x) { return x.id === q.id; }), o = l[i + dir]; if (!o) { toast(dir < 0 ? 'Уже первый в разделе' : 'Уже последний в разделе'); return; }
    var a = q.order; q.order = o.order; o.order = a; saveQ(q); saveQ(o);
  }
  function listObj(q, k) { return k === 'items' || k === 'fields' ? q[k] : q[k]; }
  var armed = null;
  function armDelete(btn, what, doIt) {
    if (armed && armed.btn === btn) { armed = null; doIt(); return; }
    if (armed) armed.btn.classList.remove('arm');
    armed = { btn: btn }; btn.classList.add('arm'); btn.textContent = 'Точно удалить ' + what + '?';
    setTimeout(function () { if (armed && armed.btn === btn) { armed = null; if (btn.isConnected) { btn.classList.remove('arm'); btn.textContent = btn.dataset.orig || 'Удалить'; } } }, 4000);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) { var row = e.target.closest('.q'); if (row && !e.target.closest('.h')) select({ kind: 'q', id: row.dataset.qid }); return; }
    var act = b.dataset.act, q = S.sel && S.sel.kind === 'q' ? getQ(S.sel.id) : null, i = +b.dataset.i;
    if (!b.dataset.orig) b.dataset.orig = b.textContent;
    switch (act) {
      case 'meta': return select({ kind: 'meta' });
      case 'tog': S.open[b.dataset.id] = !S.open[b.dataset.id]; return renderTree();
      case 'secedit': S.open[b.dataset.id] = true; return select({ kind: 'sec', id: b.dataset.id });
      case 'addq': {
        var nq = { brief: S.brief, sec: b.dataset.id, id: uid(), order: nextOrder(b.dataset.id), type: 'single', title: 'Новый вопрос', opts: [{ l: 'Вариант 1' }, { l: 'Вариант 2' }] };
        S.qs[K(nq.brief, nq.id)] = nq; S.open[nq.sec] = true; saveQ(nq); return select({ kind: 'q', id: nq.id });
      }
      case 'addsec': {
        var l = secList(), ns = { brief: S.brief, id: uid(), order: (l.length ? l[l.length - 1].order : 0) + 10, title: 'Новый раздел', intro: '' };
        S.secs[K(ns.brief, ns.id)] = ns; saveSec(ns); S.open[ns.id] = true; return select({ kind: 'sec', id: ns.id });
      }
      case 'up': reorderQ(q, -1); return renderAll();
      case 'down': reorderQ(q, 1); return renderAll();
      case 'dup': {
        var c = JSON.parse(JSON.stringify(q)); c.id = uid(); c.title = q.title + ' (копия)'; c.order = q.order + 1;
        var nxt = qList(q.sec).filter(function (x) { return x.order > q.order; })[0]; if (nxt && nxt.order <= c.order) c.order = (q.order + nxt.order) / 2;
        S.qs[K(c.brief, c.id)] = c; saveQ(c); return select({ kind: 'q', id: c.id });
      }
      case 'delq': return armDelete(b, 'вопрос', function () { delete S.qs[K(q.brief, q.id)]; enqueue('questions/' + K(q.brief, q.id), null); S.sel = null; renderAll(); toast('Вопрос удалён'); });
      case 'secup': case 'secdn': {
        var sl = secList(), si = sl.findIndex(function (x) { return x.id === S.sel.id; }), so = sl[si + (act === 'secup' ? -1 : 1)]; if (!so) return toast('Дальше двигать некуда');
        var s0 = sl[si], tmp = s0.order; s0.order = so.order; so.order = tmp; saveSec(s0); saveSec(so); return renderAll();
      }
      case 'delsec': return armDelete(b, 'раздел', function () {
        var sid = S.sel.id; qList(sid).forEach(function (x) { delete S.qs[K(x.brief, x.id)]; enqueue('questions/' + K(x.brief, x.id), null); });
        delete S.secs[K(S.brief, sid)]; enqueue('sections/' + K(S.brief, sid), null); S.sel = null; renderAll(); toast('Раздел удалён');
      });
      case 'oadd': q.opts = q.opts || []; q.opts.push({ l: 'Новый вариант' }); touch(q); return renderEditor();
      case 'odel': q.opts.splice(i, 1); touch(q); return renderEditor();
      case 'oup': move(q.opts, i, -1); touch(q); return renderEditor();
      case 'odn': move(q.opts, i, 1); touch(q); return renderEditor();
      case 'optsmanual': delete q.optsFrom; q.opts = [{ l: 'Вариант 1' }]; touch(q); return renderEditor();
      case 'itemsmanual': delete q.itemsFrom; q.items = [{ id: 'i1', l: 'Пункт 1' }]; touch(q); return renderEditor();
      case 'itemsfrom': { var rq = getQ('rooms') ? 'rooms' : (allQ().filter(function (x) { return x.opts; })[0] || {}).id; if (!rq) return toast('Нет подходящего вопроса со списком'); delete q.items; q.itemsFrom = rq; touch(q); return renderEditor(); }
      case 'colsmanual': delete q.colsFrom; q.cols = ['Колонка 1', 'Колонка 2']; touch(q); return renderEditor();
      case 'ladd': { var k = b.dataset.k; q[k] = q[k] || []; q[k].push(k === 'cols' ? 'Новая колонка' : { id: 'x' + Date.now().toString(36), l: 'Новый пункт' }); touch(q); return renderEditor(); }
      case 'ldel': q[b.dataset.k].splice(i, 1); touch(q); return renderEditor();
      case 'lup': move(q[b.dataset.k], i, -1); touch(q); return renderEditor();
      case 'ldn': move(q[b.dataset.k], i, 1); touch(q); return renderEditor();
      case 'radd': q.rows = q.rows || []; q.rows.push({ id: 'r' + Date.now().toString(36), l: 'Новая строка', opts: ['Вариант 1', 'Вариант 2'] }); touch(q); return renderEditor();
      case 'rdel': q.rows.splice(i, 1); touch(q); return renderEditor();
      case 'rup': move(q.rows, i, -1); touch(q); return renderEditor();
      case 'rdn': move(q.rows, i, 1); touch(q); return renderEditor();
      case 'showall': delete q.show; touch(q); return renderEditor();
      case 'showcond': { var pr = allQ().filter(function (x) { return x.id !== q.id; })[0]; if (!pr) return toast('Нет других вопросов'); q.show = { mode: 'all', rules: [{ q: pr.id, op: 'is', v: optsOf(pr)[0] || '' }] }; touch(q); return renderEditor(); }
      case 'rule-add': { var pr2 = allQ().filter(function (x) { return x.id !== q.id; })[0]; q.show.rules.push({ q: pr2.id, op: 'is', v: optsOf(pr2)[0] || '' }); touch(q); return renderEditor(); }
      case 'rule-del': q.show.rules.splice(i, 1); if (!q.show.rules.length) delete q.show; touch(q); return renderEditor();
      case 'obulk': return bulkOpts(q);
      case 'img': { var fi = $('#fileIn'); fi.dataset.i = i; fi.value = ''; return fi.click(); }
    }
  });

  function bulkOpts(q) {
    var bx = $('#popBx');
    bx.innerHTML = '<h3>Вставить варианты списком</h3><p class="note">Каждая строка станет отдельным вариантом. Текущие варианты будут заменены.</p><textarea id="bulk">' + esc((q.opts || []).map(function (o) { return o.l; }).join('\n')) + '</textarea><div class="bar" style="margin-top:12px"><button class="btn main" id="bulkOk">Применить</button><button class="btn" id="bulkNo">Отмена</button></div>';
    $('#pop').classList.add('on');
    $('#bulkNo').onclick = function () { $('#pop').classList.remove('on'); };
    $('#bulkOk').onclick = function () {
      var old = {}; (q.opts || []).forEach(function (o) { old[o.l] = o; });
      q.opts = $('#bulk').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).map(function (l) { return old[l] || { l: l }; });
      $('#pop').classList.remove('on'); touch(q); renderEditor();
    };
  }

  document.addEventListener('change', function (e) {
    var t = e.target, q = S.sel && S.sel.kind === 'q' ? getQ(S.sel.id) : null;
    if (t.id === 'fileIn') {
      var f = t.files && t.files[0]; if (!f || !q) return; var i = +t.dataset.i;
      if (!assets) return toast('Загрузка картинок недоступна');
      toast('Загружаем картинку…');
      assets.upload(f).then(function (r) { q.opts[i].img = r.id; touch(q); renderEditor(); toast('Картинка добавлена'); }, function (err) { toast('Не удалось загрузить: ' + (err && err.code || 'ошибка')); });
      return;
    }
    if (t.dataset.showmode !== undefined && q) { q.show.mode = t.value; return touch(q); }
    if (t.dataset.rule && q) {
      var r = q.show.rules[+t.dataset.i], k = t.dataset.rule; r[k] = t.value;
      if (k === 'q') { var s = getQ(r.q); if (r.op === 'is' || r.op === 'isNot') r.v = s && s.opts ? optsOf(s)[0] || '' : ''; }
      touch(q); return renderEditor();
    }
    if (t.dataset.f && q) {
      var f2 = t.dataset.f;
      if (t.type === 'checkbox') { if (t.checked) q[f2] = true; else delete q[f2]; }
      else if (f2 === 'type') { q.type = t.value; defaults(q); touch(q); return renderEditor(); }
      else if (f2 === 'sec') { q.sec = t.value; q.order = nextOrder(t.value) + 0; S.open[t.value] = true; touch(q); return renderEditor(); }
      return touch(q);
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target, q = S.sel && S.sel.kind === 'q' ? getQ(S.sel.id) : null;
    if (t.id === 'flt') { S.filter = t.value; return renderTree(); }
    if (t.dataset.m) { var m = S.meta[S.brief]; m[t.dataset.m] = t.value; return saveMeta(); }
    if (t.dataset.s && S.sel && S.sel.kind === 'sec') { var s = S.secs[K(S.brief, S.sel.id)]; s[t.dataset.s] = t.value; saveSec(s); return renderTree(); }
    if (!q) return;
    if (t.dataset.f && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      var f = t.dataset.f; q[f] = (f === 'max') ? (t.value === '' ? undefined : +t.value) : t.value; if (q[f] === '' || q[f] === undefined) delete q[f];
      if (f === 'title') { var h2 = $('#editor h2'); if (h2) h2.textContent = q.title || 'Без названия'; }
      return touch(q);
    }
    if (t.dataset.opt) { q.opts[+t.dataset.i][t.dataset.opt] = t.value; if (!t.value && t.dataset.opt === 'd') delete q.opts[+t.dataset.i].d; return touch(q); }
    if (t.dataset.list === 'items') { q.items[+t.dataset.i].l = t.value; return touch(q); }
    if (t.dataset.list === 'cols') { q.cols[+t.dataset.i] = t.value; return touch(q); }
    if (t.dataset.fld !== undefined) { q.fields[+t.dataset.fld].l = t.value; return touch(q); }
    if (t.dataset.row) { var r = q.rows[+t.dataset.i]; if (t.dataset.row === 'l') r.l = t.value; else r.opts = t.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean); return touch(q); }
    if (t.dataset.colmap) { q.colsFrom.map[t.dataset.colmap] = t.value; return touch(q); }
    if (t.dataset.rule === 'v') { q.show.rules[+t.dataset.i].v = t.value; return touch(q); }
  });

  /* ---------- перетаскивание ---------- */
  document.addEventListener('dragstart', function (e) { var r = e.target.closest && e.target.closest('.q'); if (!r) return; dragId = r.dataset.qid; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
  document.addEventListener('dragover', function (e) {
    if (!dragId) return; var r = e.target.closest('.q'), h = e.target.closest('.sech');
    document.querySelectorAll('.drop,.dropT').forEach(function (x) { x.classList.remove('drop', 'dropT'); });
    if (r && r.dataset.qid !== dragId) { e.preventDefault(); r.classList.add('drop'); } else if (h) { e.preventDefault(); h.classList.add('dropT'); }
  });
  document.addEventListener('drop', function (e) {
    if (!dragId) return; var r = e.target.closest('.q'), h = e.target.closest('.sech'), q = getQ(dragId);
    document.querySelectorAll('.drop,.dropT').forEach(function (x) { x.classList.remove('drop', 'dropT'); });
    if (!q) { dragId = null; return; }
    e.preventDefault();
    if (r && r.dataset.qid !== dragId) {
      var tgt = getQ(r.dataset.qid), list = qList(tgt.sec).filter(function (x) { return x.id !== q.id; }), idx = list.findIndex(function (x) { return x.id === tgt.id; }), prev = list[idx - 1];
      q.sec = tgt.sec; q.order = prev ? (prev.order + tgt.order) / 2 : tgt.order - 5;
    } else if (h) { var sid = h.dataset.dropsec; q.sec = sid; q.order = nextOrder(sid); S.open[sid] = true; }
    dragId = null; saveQ(q); renderAll();
  });
  document.addEventListener('dragend', function () { dragId = null; document.querySelectorAll('.drop,.dropT').forEach(function (x) { x.classList.remove('drop', 'dropT'); }); });

  /* ---------- шапка ---------- */
  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; S.brief = b.dataset.b;
    document.querySelectorAll('#tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var f = allQ()[0]; S.sel = f ? { kind: 'q', id: f.id } : null; if (f) S.open[f.sec] = true; renderAll();
  });
  $('#bSave').onclick = flushAll;
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы')) { e.preventDefault(); flushAll(); } });
  $('#mtabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setView(b.dataset.v); });
  $('#bJson').onclick = function () {
    var data = JSON.stringify({ meta: S.meta[S.brief], sections: secList(), questions: allQ() }, null, 1);
    $('#popBx').innerHTML = '<h3>JSON брифа</h3><p class="note">Резервная копия всех вопросов этого брифа. Скопируйте и сохраните.</p><textarea id="jt" readonly>' + esc(data) + '</textarea><div class="bar" style="margin-top:12px"><button class="btn main" id="jc">Скопировать</button><button class="btn" id="jx">Закрыть</button></div>';
    $('#pop').classList.add('on'); $('#jx').onclick = function () { $('#pop').classList.remove('on'); };
    $('#jc').onclick = function () { var ta = $('#jt'); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {} (navigator.clipboard ? navigator.clipboard.writeText(data).then(function () { toast('Скопировано'); }, function () { toast(ok ? 'Скопировано' : 'Выделите текст и скопируйте вручную'); }) : Promise.resolve().then(function () { toast(ok ? 'Скопировано' : 'Выделите текст и скопируйте вручную'); })); };
  };
  $('#bVer').onclick = function () {
    var list = S.versions.filter(function (v) { return v.brief === S.brief; });
    $('#popBx').innerHTML = '<h3>Версии брифа</h3><p class="note">Сохраните версию перед большими правками. Чтобы вернуться к старой, напишите Claude: он восстановит её из базы.</p><div class="bar" style="margin:10px 0"><input class="in" id="vl" placeholder="Название версии (необязательно)" style="flex:1"><button class="btn main" id="vs">Сохранить версию</button></div>' +
      (list.length ? list.map(function (v) { return '<div class="ver"><span>' + esc(v.label) + '</span><span style="color:var(--mut)">' + new Date(v.at).toLocaleString('ru-RU') + ' · ' + v.count + ' вопр.</span></div>'; }).join('') : '<p class="note">Сохранённых версий пока нет.</p>') + '<div class="bar" style="margin-top:12px"><button class="btn" id="vx">Закрыть</button></div>';
    $('#pop').classList.add('on'); $('#vx').onclick = function () { $('#pop').classList.remove('on'); };
    $('#vs').onclick = function () {
      var at = Date.now(), label = $('#vl').value.trim() || ('Версия ' + new Date(at).toLocaleString('ru-RU')), qs = allQ();
      db.doc('versions/' + S.brief + '__' + at).set(JSON.parse(JSON.stringify({ brief: S.brief, at: at, label: label, count: qs.length, meta: S.meta[S.brief], sections: secList(), questions: qs }))).then(function () { toast('Версия сохранена'); $('#pop').classList.remove('on'); }, function () { toast('Не удалось сохранить версию (слишком большая или нет связи)'); });
    };
  };
  $('#pop').addEventListener('click', function (e) { if (e.target.id === 'pop') $('#pop').classList.remove('on'); });
  window.addEventListener('beforeunload', function () { /* несохранённые правки дописываются автоматически, ничего не теряется */ });

  /* ---------- запуск ---------- */
  setView('tree');
  Promise.all([window.claude.use('db'), window.claude.use('assets')]).then(function (r) {
    db = r[0]; assets = r[1];
    if (!db) { $('#editor').innerHTML = '<div class="empty">Не удалось подключить базу. Откройте редактор под своим аккаунтом Claude.</div>'; setStat('Нет базы', 'err'); return; }
    subscribe();
    setTimeout(function () { if (!firstDone) { $('#editor').innerHTML = '<div class="empty">Вопросы пока не загрузились. Если страница пустая, Claude ещё переносит данные: подождите минуту и обновите.</div>'; setStat('Ждём данные', 'busy'); } }, 10000);
  });
})();
</script>
